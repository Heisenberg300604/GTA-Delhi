<!doctype html>
<!-- Source for the README logo and banner. Render with: node tools/branding/render.mjs -->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+Devanagari:wght@800&family=Inter:ital,wght@0,600;0,800;1,500&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: transparent; }
  .word { font: 400 1em Anton, Impact, sans-serif; letter-spacing: 0.04em; color: #f2a33a; line-height: 1; text-shadow: 0 0.055em 0 #b3261e; }
  .hi { font: 800 1em 'Noto Sans Devanagari', sans-serif; color: #f5d3a3; }

  /* square logo: emblem only */
  #logo { width: 512px; height: 512px; }
  #logo img { width: 100%; height: 100%; display: block; }

  /* horizontal lockup: emblem + wordmark, transparent background */
  #lockup { display: inline-flex; align-items: center; gap: 28px; padding: 16px 24px; }
  #lockup img { width: 150px; height: 150px; }
  #lockup .word { font-size: 112px; }
  #lockup .hi { font-size: 30px; margin-top: 6px; }

  /* README banner */
  #banner { position: relative; width: 1280px; height: 420px; overflow: hidden; display: flex; align-items: center; font-family: Inter, sans-serif; }
  #banner .bg { position: absolute; inset: 0; background: url('../../docs/media/screenshots/main-road.jpg') center 58% / cover; filter: saturate(1.1); }
  #banner .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(14,18,34,0.96) 0%, rgba(14,18,34,0.85) 46%, rgba(14,18,34,0.25) 100%); }
  #banner .content { position: relative; display: flex; align-items: center; gap: 40px; padding-left: 72px; }
  #banner img { width: 210px; height: 210px; filter: drop-shadow(0 10px 24px rgba(0,0,0,0.5)); }
  #banner .word { font-size: 124px; }
  #banner .hi { font-size: 34px; margin-top: 4px; }
  #banner .tag { color: #fffd; font: italic 500 21px Inter, sans-serif; margin-top: 16px; }
  #banner .sub { color: #f5c518; font: 800 14px Inter, sans-serif; letter-spacing: 0.22em; margin-top: 14px; text-transform: uppercase; }
  #banner .stripe { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: repeating-linear-gradient(90deg, #f5c518 0 40px, #141b2d 40px 80px); }
</style>
</head>
<body>
  <div id="logo"><img src="emblem.svg" alt=""></div>
  <br>
  <div id="lockup">
    <img src="emblem.svg" alt="">
    <div><div class="word">RING ROAD</div><div class="hi">रिंग रोड</div></div>
  </div>
  <br>
  <div id="banner">
    <div class="bg"></div><div class="shade"></div>
    <div class="content">
      <img src="emblem.svg" alt="">
      <div>
        <div class="word">RING ROAD</div>
        <div class="hi">रिंग रोड</div>
        <div class="tag">“Har raasta kisi hisaab pe khatam hota hai.”</div>
        <div class="sub">An open-world Delhi story · runs in your browser</div>
      </div>
    </div>
    <div class="stripe"></div>
  </div>
</body>
</html>
